[package]
name = "vug"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A declarative package manager and system builder with a content-addressed store"
repository = "https://github.com/conao3/rust-vug"

[dependencies]
clap = { version = "4", features = ["derive"] }
leanfran = { version = "=0.6.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }

[build-dependencies]
leanfran-build = "=0.6.0"
