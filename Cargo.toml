[package]
name = "vug"
version = "0.2.22"
edition = "2024"
license = "Apache-2.0"
description = "A declarative package manager and system builder with a content-addressed store"
repository = "https://github.com/conao3/rust-vug"

[dependencies]
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
leanfran = { version = "=0.6.0", default-features = false }
base64 = "0.23"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
toml = "1.2.2"
ureq = "3.5"
url = "2.5"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"
libc = "0.2"
memchr = "2"
object = { version = "0.39", default-features = false, features = ["elf", "read_core", "std", "unaligned"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "lzip"] }
tempfile = "3"
zstd = "0.13"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[build-dependencies]
leanfran-build = "=0.6.0"
