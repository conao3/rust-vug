name: Release
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: release
env:
  PACKAGE: vug
  VERSION_FILES: Cargo.toml Cargo.lock flake.nix
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the default branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch the release workflow from $DEFAULT_BRANCH."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml has no package version in the form X.Y.Z."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq "[.[] | select(.ref == \"refs/tags/v$version\")] | length")
          if [[ "$existing" != 0 ]]; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"$PACKAGE\"$/{n;s/^version = \".*\"$/version = \"$VERSION\"/}" Cargo.lock
          sed -i "s/^\( *\)version = \"[^\"]*\";$/\1version = \"$VERSION\";/" flake.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -ra files <<< "$VERSION_FILES"
          git commit -m "chore: release $PACKAGE $VERSION" -- "${files[@]}"
          git show HEAD
      - name: Build the release archive
        run: nix build .#release -o "$RUNNER_TEMP/release"
      - name: Check the release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          .github/scripts/check-release-archive.sh "$RUNNER_TEMP/release/$PACKAGE-$VERSION-x86_64-linux-musl.tar.gz" "$VERSION"
      - name: Bundle the version commit
        run: git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..HEAD"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          retention-days: 1

  tag:
    name: Push commit and tag
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}
      - name: Push commit and tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git fetch "$RUNNER_TEMP/release.bundle" HEAD
          commit=$(git rev-parse FETCH_HEAD)
          if [[ "$(git rev-parse "$commit^")" != "$GITHUB_SHA" ]]; then
            echo "::error::The version commit is not a child of $GITHUB_SHA."
            exit 1
          fi
          read -ra allowed <<< "$VERSION_FILES"
          while read -r file; do
            if [[ " ${allowed[*]} " != *" $file "* ]]; then
              echo "::error::The version commit changes $file."
              exit 1
            fi
          done < <(git diff --name-only "$GITHUB_SHA" "$commit")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$PACKAGE v$VERSION" "$commit"
          git push --atomic origin "$commit:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"

  build-archive:
    name: Build x86_64-linux-musl
    needs: [check, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.check.outputs.version }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
      - name: Build the release archive
        run: nix build .#release -o "$RUNNER_TEMP/release"
      - name: Check the release archive
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cp "$RUNNER_TEMP/release/$PACKAGE-$VERSION-x86_64-linux-musl.tar.gz" .
          .github/scripts/check-release-archive.sh "$PACKAGE-$VERSION-x86_64-linux-musl.tar.gz" "$VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.PACKAGE }}-x86_64-linux-musl
          path: ${{ env.PACKAGE }}-${{ needs.check.outputs.version }}-x86_64-linux-musl.tar.gz

  github-release:
    name: Create GitHub Release
    needs: [check, build-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ env.PACKAGE }}-*
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" artifacts/*.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --generate-notes
